[build]
  publish = "build"
  command = "npm run build"

# Cache agressif pour les assets statiques (JS, CSS, Images avec hash)
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pas de cache pour l'index.html (pour toujours servir la version à jour)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"